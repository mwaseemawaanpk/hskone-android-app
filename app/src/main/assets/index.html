<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>新HSK教程 1 – Audio Companion</title>
<style>
/* Colour system: one colour per language so the eye always knows what it is reading.
   Seal red = Chinese (and primary actions) · Porcelain blue = English · Jade = Urdu · Gold = "now playing" */
:root{color-scheme:light dark;
--bg:#f1f4f9;--card:#fff;--tint:#f5f7fb;--ink:#131a27;--mute:#586378;--line:#e0e5ee;
--red:#c23a2f;--red-soft:#fbe8e5;--blue:#2a5bb0;--blue-soft:#e5edfa;--jade:#0c7a5a;--jade-soft:#dcf2e9;
--gold:#d8a31d;--hl:#fff3d6;--on:#fff;--vbg:#fff4d9;--vline:#f0d9a0;--vtint:#ffeab8;--vink:#7a5200;
--shadow:0 1px 2px rgba(19,26,39,.06),0 10px 24px -14px rgba(19,26,39,.2);
--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun","Noto Serif",Georgia,serif;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
--nast:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Noto Naskh Arabic","Segoe UI",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0d1119;--card:#151a25;--tint:#1b2130;--ink:#edf0f6;--mute:#9ba6bb;--line:#252d3e;
--red:#ff7f6e;--red-soft:#34201f;--blue:#8fb2ff;--blue-soft:#1a2947;--jade:#4fd3a3;--jade-soft:#12342a;
--gold:#e9b83a;--hl:#2d2715;--on:#1a0d0b;--vbg:#2b2413;--vline:#4a3d1b;--vtint:#3a2f14;--vink:#f0c868;
--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-bottom:env(safe-area-inset-bottom,0px)}
button,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hide{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
 padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top>*{max-width:720px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.seal{flex:none;width:36px;height:36px;border-radius:8px;background:var(--red);color:var(--on);
 font:700 21px/36px var(--serif);text-align:center;transform:rotate(-3deg);
 box-shadow:inset 0 0 0 2px var(--red),inset 0 0 0 3.5px rgba(255,255,255,.55)}
h1{margin:0;font:650 17px/1.2 var(--sans);letter-spacing:.01em}
.sub{margin:1px 0 0;font-size:12.5px;color:var(--mute)}
.menu{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.menu::-webkit-scrollbar{display:none}
.chip{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
 font:600 15px var(--sans);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.chip.on{background:var(--red);border-color:var(--red);color:var(--on)}
.chip:disabled{opacity:.4;cursor:default;border-style:dashed;background:transparent}

main{max-width:720px;margin:0 auto;padding:14px 16px 56px}

/* controls */
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border:1px solid transparent;
 border-radius:999px;background:var(--red);color:var(--on);font-weight:600;font-size:14px}
.btn.alt{background:var(--red-soft);color:var(--red)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.nx{background:transparent;color:var(--red);border-color:var(--red)}
.btn svg{width:13px;height:13px}
.tog{appearance:none;display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 14px;border:1px solid var(--line);
 border-radius:999px;background:var(--card);color:var(--ink);font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.tog i{width:10px;height:10px;border-radius:50%;background:var(--line);box-shadow:inset 0 0 0 1px var(--mute)}
.tog .st{font-weight:500;color:var(--mute);font-size:12.5px}
.tog.en.is-on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.tog.en.is-on i{background:var(--blue);box-shadow:none}
.tog.ur.is-on{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.tog.ur.is-on i{background:var(--jade);box-shadow:none}
.tog.is-on .st{color:inherit}
select{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px}

/* lesson headings */
.lt{margin:26px 2px 4px;font:700 30px/1.15 var(--serif);letter-spacing:.01em}
.lt .no{display:block;margin-bottom:5px;font:600 13px var(--sans);color:var(--red);letter-spacing:0}
.lt .en{display:block;margin-top:6px;font:400 15px var(--sans);color:var(--blue)}
.sec{display:flex;align-items:center;gap:9px;margin:26px 2px 10px;font:650 15px var(--sans)}
.sec::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--red)}
.vh{margin:18px 2px 8px;font:600 13px var(--sans);color:var(--mute)}

/* cards and dialogue rows */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 12px 10px;margin-bottom:12px;box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0 10px}
.line{display:grid;grid-template-columns:62px 1fr 46px;gap:10px;align-items:center;padding:12px 8px;border-top:1px solid var(--line);
 border-radius:12px;scroll-margin-top:140px;transition:background .2s,box-shadow .2s}
.bar+.line,.line.solo{border-top-color:transparent}
.line.solo{grid-template-columns:1fr 46px}
.line.playing{background:var(--hl);box-shadow:inset 3px 0 0 var(--gold)}
.who{text-align:center;font-size:11px;line-height:1.3;color:var(--mute)}
.who b{display:block;margin-bottom:1px;font:600 15px/1.3 var(--serif);color:var(--ink)}
.txt{min-width:0}
.py{font-size:13.5px;color:var(--mute)}
.zh{margin:1px 0 4px;font:500 24px/1.4 var(--serif)}
.en{font-size:14px;color:var(--blue)}
.sound{margin:4px 0 7px;padding:7px 11px;border-radius:10px;background:var(--tint);border:1px solid var(--line)}
.pr{font-size:14px;font-style:italic;color:var(--ink)}
.ur{direction:rtl;text-align:right;font:400 18px/2 var(--nast)}
.prx{font-size:16px;color:var(--jade)}
.ut{margin-top:4px;font-size:17px;color:var(--jade)}
.pos{color:var(--mute)}

/* audio buttons */
.spk{position:relative;width:46px;height:46px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--red-soft);color:var(--red);transition:background .15s,color .15s}
.spk svg{width:22px;height:22px}
.spk.on{background:var(--red);color:var(--on)}
.spk.on::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--red);animation:ring 1.2s ease-out infinite}
@keyframes ring{from{transform:scale(.88);opacity:.7}to{transform:scale(1.28);opacity:0}}
.pill{appearance:none;position:relative;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;margin-inline-start:8px;
 border:0;border-radius:999px;background:var(--blue-soft);color:var(--blue);font:700 11.5px/1 var(--sans);vertical-align:middle;transition:background .15s,color .15s}
.pill::after{content:"";position:absolute;inset:-9px -4px}
.pill svg{width:14px;height:14px}
.pill.urb{background:var(--jade-soft);color:var(--jade)}
.pill.urb span{font:600 13px/1 "Noto Naskh Arabic","Segoe UI",system-ui,sans-serif}
.pill.on{background:var(--blue);color:var(--on)}
.pill.urb.on{background:var(--jade);color:var(--on)}

/* vocabulary sheet: amber, so it looks different from the lesson cards */
.card.vc{background:var(--vbg);border-color:var(--vline)}
.card.vc td{border-top-color:var(--vline)}
.card.vc .sound{background:var(--vtint);border-color:var(--vline)}
.vh{color:var(--vink)!important;display:flex;align-items:center;gap:8px}
.vh::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--gold)}
/* vocabulary */
table{width:100%;border-collapse:collapse}
td{padding:10px 4px;vertical-align:middle;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td.zh{width:1%;padding-right:14px;margin:0;white-space:nowrap}
td:last-child{width:54px;text-align:right}

.note{max-width:62ch;margin:14px 4px 0;font-size:12.5px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:50;max-width:min(92vw,420px);padding:11px 16px;
 border-radius:14px;background:var(--ink);color:var(--bg);font-size:13.5px;text-align:center;opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.lt{font-size:26px}.line{grid-template-columns:54px 1fr 44px;gap:8px}}
/* counting */
.chip.cnt{width:auto;display:inline-flex;align-items:center;gap:7px;padding:0 14px 0 12px;margin-right:6px;border-color:var(--red);color:var(--red);font-weight:650;font-size:14px}
.chip.cnt b{font:700 18px/1 var(--serif)}
.chip.cnt.on{color:var(--on)}
.tip{margin:4px 0 12px;padding:10px 12px;border-radius:12px;background:var(--tint);border:1px solid var(--line);font-size:13.5px;line-height:1.65;color:var(--mute)}
.tip b{color:var(--ink)}
.tip .zh{display:inline;margin:0;font:600 16px var(--serif);color:var(--ink)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:2px 0 4px}
.ntile{position:relative;display:flex;flex-direction:column;align-items:center;min-height:152px;padding:10px 6px;border:1px solid var(--line);border-radius:16px;background:var(--tint);color:var(--ink);text-align:center;line-height:1.3;transition:background .15s,border-color .15s,box-shadow .15s}
.ntile>span{display:block}
.ntile .dg{position:absolute;top:7px;left:10px;font:600 12px var(--sans);color:var(--mute);font-variant-numeric:tabular-nums}
.ntile .ud{position:absolute;top:4px;right:10px;font:500 13px var(--nast);color:var(--jade)}
.ntile .h{margin-top:14px;font:600 34px/1.2 var(--serif)}
.ntile .p{font-size:13.5px;color:var(--mute)}
.ntile .pr{margin-top:3px;font-size:13px}
.ntile .prx{font-size:15px;line-height:1.8;text-align:center}
.ntile .w{margin-top:auto;padding-top:4px;font-size:12px;color:var(--blue)}
.ntile .w span{font:400 14px var(--nast);color:var(--jade)}
.ntile.on,.ntile.playing{background:var(--hl);border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.big{font:700 16px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.nin{width:min(100%,220px);height:44px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:600 20px var(--sans);font-variant-numeric:tabular-nums}
.nbig{padding:2px 2px 10px;font:600 14px var(--sans);color:var(--mute)}
.nbig b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.nbig span{margin-left:8px;font:500 18px var(--nast);color:var(--jade)}
.nrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toks{display:flex;flex-wrap:wrap;gap:6px}
.tok{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:6px 8px;border-radius:12px;background:var(--red-soft)}
.tok b{font:600 28px/1.25 var(--serif);color:var(--ink)}
.tok i{font-style:normal;font-size:12px;color:var(--red)}
.nsound{margin-top:12px}
.qtop{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.qtop p{flex:1;margin:0;font-size:13.5px;color:var(--mute)}
.score{margin-left:auto;white-space:nowrap;font:600 13px var(--sans);color:var(--mute);font-variant-numeric:tabular-nums}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qopt{height:58px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:600 22px var(--sans);font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
.qopt.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.qopt.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qfb{min-height:46px;margin:12px 2px 6px;font-size:14px;color:var(--mute)}
.qfb .zh{display:inline;margin:0;font:600 20px var(--serif);color:var(--ink)}
</style></head><body>
<header class="top">
 <div class="brand"><span class="seal" aria-hidden="true">汉</span><div><h1>新HSK教程 1</h1><p class="sub">Audio Companion</p></div></div>

</header>
<main>

</main>

 {h:"课文 2 · Text 2",d:[["yx","你会做饭吗？","Nǐ huì zuò fàn ma?","Do you know how to cook?"],["yt","我会做。","Wǒ huì zuò.","Yes, I do."],["yx","你会做什么？","Nǐ huì zuò shénme?","What dishes can you make?"],["yt","我会做面条儿、饺子，也会做一些菜。星期天我也做饭。","Wǒ huì zuò miàntiáor, jiǎozi, yě huì zuò yìxiē cài. Xīngqītiān wǒ yě zuò fàn.","I can make noodles, jiaozi and some dishes. I also cook on Sundays."]],

 {h:"课文 2 · Text 2",d:[["li","下午我想去电影院看电影，你去吗？","Xiàwǔ wǒ xiǎng qù diànyǐngyuàn kàn diànyǐng, nǐ qù ma?","I want to watch a movie at the cinema this afternoon. Are you going?"],["bai","我不想去，下午还有事。","Wǒ bù xiǎng qù, xiàwǔ hái yǒu shì.","I don't want to go. I still have something to do."],["li","好的。明天呢？","Hǎo de. Míngtiān ne?","Okay. How about tomorrow?"],["bai","我明天下午两点还上课呢，四点半下课。","Wǒ míngtiān xiàwǔ liǎng diǎn hái shàngkè ne, sì diǎn bàn xiàkè.","I have a class tomorrow at 2:00 and it finishes at 4:30."]],

 {h:"课文 3 · Text 3",d:[["yx","喂，你在哪儿呢？","Wèi, nǐ zài nǎr ne?","Hey, where are you?"],["lm","我在家里呢。","Wǒ zài jiāli ne.","I'm at home."],["yx","我晚上六点半下班。","Wǒ wǎnshang liù diǎn bàn xiàbān.","I'll finish work at 6:30 in the evening."],["lm","我八点去医院上班。","Wǒ bā diǎn qù yīyuàn shàngbān.","I'll go to work at the hospital at 8:00."],["yx","好的，你去店里买些菜吧。","Hǎo de, nǐ qù diànli mǎi xiē cài ba.","Alright, could you go to the store to buy some vegetables?"],["lm","好，我十分钟后去。","Hǎo, wǒ shí fēnzhōng hòu qù.","Okay, I'll go in ten minutes."]],

 {h:"课文 2 · Text 2",d:[["bai","我们在哪儿见呢？","Wǒmen zài nǎr jiàn ne?","Where shall we meet?"],["li","在学校书店前见吧。","Zài xuéxiào shūdiàn qián jiàn ba.","Let's meet in front of the school bookstore."],["bai","好的。下午两点你能到吗？","Hǎo de. Xiàwǔ liǎng diǎn nǐ néng dào ma?","Okay. Can you arrive at 2:00 in the afternoon?"],["li","我能到。我在学校吃午饭。","Wǒ néng dào. Wǒ zài xuéxiào chī wǔfàn.","Yes, I can. I'll have lunch at school."]],

 {h:"课文 3 · Text 3",d:[["lm","小胡，还没吃饭呢？","Xiǎo Hú, hái méi chī fàn ne?","Xiao Hu, haven't you eaten yet?"],["hu","没吃呢。","Méi chī ne.","No, I haven't."],["lm","大医院病人多，医生非常忙。","Dà yīyuàn bìngrén duō, yīshēng fēicháng máng.","There are a lot of patients in big hospitals, and doctors are very busy."],["hu","是的。我爸爸也在医院工作，他也非常忙。","Shì de. Wǒ bàba yě zài yīyuàn gōngzuò, tā yě fēicháng máng.","True. My father also works at a hospital, and he's extremely busy too."],["lm","你家有两个医生？","Nǐ jiā yǒu liǎng gè yīshēng?","So there are two doctors in your family?"],["hu","对。","Duì.","Yes."]],

,{n:9,zh:"我明天上午在学校学习",en:"I'll be studying at school tomorrow morning",t:[
 {h:"课文 1 · Text 1",d:[["li","学校前边有一家电影院。","Xuéxiào qiánbian yǒu yì jiā diànyǐngyuàn.","There is a cinema in front of the school."],["bai","对。我们晚上去那个电影院看电影吧。","Duì. Wǒmen wǎnshang qù nàge diànyǐngyuàn kàn diànyǐng ba.","Yes. Let's go to the cinema to watch a movie tonight."],["li","好！我们七点在电影院外边见，好吗？","Hǎo! Wǒmen qī diǎn zài diànyǐngyuàn wàibian jiàn, hǎo ma?","Great! Let's meet outside the cinema at 7:00, okay?"],["bai","好的，晚上七点见！","Hǎo de, wǎnshang qī diǎn jiàn!","Okay, see you at 7:00 in the evening!"]],
  v:[["前边","qiánbian","n.","front"],["边","bian/biān","suf./n.","indicating locality; edge; side"],["家","jiā","m.","for families or enterprises"],["那个","nàge","pron.","that"],["外边","wàibian","n.","outside"]]},
 {h:"课文 2 · Text 2",d:[["bai","椅子上有一本中文书，那是谁的书？","Yǐzi shang yǒu yì běn Zhōngwén shū, nà shì shéi de shū?","There is a Chinese book on the chair. Whose book is that?"],["chen","是我的书，谢谢。这是我的第二本中文书。","Shì wǒ de shū, xièxie. Zhè shì wǒ de dì-èr běn Zhōngwén shū.","It's my book. Thank you. This is my second Chinese book."],["bai","不客气。你明天上午在哪儿？","Bú kèqi. Nǐ míngtiān shàngwǔ zài nǎr?","You're welcome. Where will you be tomorrow morning?"],["chen","我明天上午在学校学习。","Wǒ míngtiān shàngwǔ zài xuéxiào xuéxí.","I'll be studying at school tomorrow morning."]],
  v:[["椅子","yǐzi","n.","chair"],["上","shang/shàng","n.","used after a noun, indicating position; higher position"],["本","běn","m.","for books"],["书","shū","n.","book"],["那","nà","pron.","that"],["第","dì","pref.","marker of ordinal numbers"],["学习","xuéxí","v.","study; learn"]]},
 {h:"课文 3 · Text 3",d:[["yx","明天星期六，你做什么？","Míngtiān Xīngqīliù, nǐ zuò shénme?","Tomorrow is Saturday. What are you going to do?"],["yt","我白天在家里读书，晚上和朋友们去外边唱歌。","Wǒ báitiān zài jiāli dúshū, wǎnshang hé péngyoumen qù wàibian chàng gē.","I will read at home during the day and go out to sing with my friends in the evening."],["yx","你唱歌很好听。","Nǐ chàng gē hěn hǎotīng.","You sing very well."],["yt","谢谢！您星期六做什么？","Xièxie! Nín Xīngqīliù zuò shénme?","Thank you! What do you do on Saturday?"],["yx","我在家里做饭、看电视，和孩子们、小狗玩。","Wǒ zài jiāli zuò fàn, kàn diànshì, hé háizimen, xiǎo gǒu wán.","I will cook, watch TV, and play with my children and my little dog at home."],["yt","我也有一只小狗。","Wǒ yě yǒu yì zhī xiǎo gǒu.","I also have a little dog."]],

,{n:10,zh:"这儿的苹果真便宜！",en:"The apples here are really cheap!",t:[
 {h:"课文 1 · Text 1",d:[["yx","请问，有杯子吗？","Qǐngwèn, yǒu bēizi ma?","Excuse me, do you have any cups?"],["sh","有，杯子在这边。","Yǒu, bēizi zài zhèbiān.","Yes, the cups are over here."],["yx","多少钱一个？","Duōshao qián yí gè?","How much is one?"],["sh","这些五块钱一个，那些十块钱一个。","Zhèxiē wǔ kuài qián yí gè, nàxiē shí kuài qián yí gè.","These are five yuan each, and those are ten yuan each."],["yx","我买这个吧。","Wǒ mǎi zhège ba.","I'll take this one, please."]],
  v:[["杯子","bēizi","n.","cup; glass"],["售货员","shòuhuòyuán","n.","shop assistant; salesperson; vendor"],["这边","zhèbiān","pron.","here; this side"],["钱","qián","n.","money"],["这些","zhèxiē","pron.","these"],["块","kuài","m.","for silver dollars or paper money"],["那些","nàxiē","pron.","those"]]},
 {h:"课文 2 · Text 2",d:[["yx","这儿的水果真不少！","Zhèr de shuǐguǒ zhēn bù shǎo!","There's so much fruit here!"],["sh","您想买什么？","Nín xiǎng mǎi shénme?","What would you like to buy?"],["yx","我想买两斤苹果。","Wǒ xiǎng mǎi liǎng jīn píngguǒ.","I'd like two jin of apples, please."],["sh","苹果三块五一斤。这些七块二，七块钱吧。","Píngguǒ sān kuài wǔ yì jīn. Zhèxiē qī kuài èr, qī kuài qián ba.","The apples are 3.5 yuan per jin. That's 7.2 yuan in total, let's round it down to 7 yuan."],["yx","好的，这儿的苹果真便宜！","Hǎo de, zhèr de píngguǒ zhēn piányi!","Great! The apples here are really affordable!"]],

 {h:"课文 3 · Text 3",d:[["yx","这家商店衣服真多！这件一百元，怎么样？","Zhè jiā shāngdiàn yīfu zhēn duō! Zhè jiàn yìbǎi yuán, zěnmeyàng?","There are so many clothes in this store! This one is 100 yuan. What do you think?"],["lm","好看，也不贵。","Hǎokàn, yě bú guì.","It looks great, and it's not expensive."],["yx","小雪能穿，买一件吧。","Xiǎoxuě néng chuān, mǎi yí jiàn ba.","Xiaoxue can wear it. Let's get one."],["lm","好的。小明能穿吗？","Hǎo de. Xiǎomíng néng chuān ma?","Okay. Do you think Xiaoming can wear it too?"],["yx","不能。这些是女孩子穿的衣服，男孩子的衣服在那儿。","Bù néng. Zhèxiē shì nǚ háizi chuān de yīfu, nán háizi de yīfu zài nàr.","No. These are girls' clothes. The boys' section is over there."],["lm","好的。","Hǎo de.","Alright."]],

,{n:11,zh:"我读大学呢",en:"I'm studying at university",t:[{h:"课文 1 · Text 1",d:[["wang", "喂，李文，你什么时候能到饭店？", "Wèi, Lǐ Wén, nǐ shénme shíhou néng dào fàndiàn?", "Hello, Li Wen. When will you arrive at the restaurant?"], ["li", "还不知道，正在找呢。它是不是在超市后边？", "Hái bù zhīdào, zhèngzài zhǎo ne. Tā shì bu shì zài chāoshì hòubian?", "Not sure yet. I'm looking for it now. Is it behind the supermarket?"], ["wang", "是的。你开车没开车？", "Shì de. Nǐ kāichē méi kāichē?", "Yes, it is. Are you driving or not?"], ["li", "我没开车，坐车呢。", "Wǒ méi kāichē, zuò chē ne.", "No, I'm not driving. I'm taking a taxi."]],v:[["时候", "shíhou", "n.", "(a point in) time"], ["饭店", "fàndiàn", "n.", "restaurant"], ["知道", "zhīdào", "v.", "know; realize"], ["正在", "zhèngzài", "adv.", "in the process of"], ["找", "zhǎo", "v.", "look for"], ["开车", "kāichē", "v.", "drive (a vehicle)"], ["车", "chē", "n.", "vehicle"]]},
{h:"课文 2 · Text 2",d:[["wang", "你还在读大学吗？", "Nǐ hái zài dú dàxué ma?", "Are you still studying at university?"], ["li", "对，我读大学呢，还是大学生。", "Duì, wǒ dú dàxué ne, hái shì dàxuéshēng.", "Yes. I'm studying at university, and I'm still an undergraduate."], ["wang", "你们学习忙不忙？", "Nǐmen xuéxí máng bu máng?", "Are you busy with your studies?"], ["li", "非常忙，我学医，我们的课很多。", "Fēicháng máng, wǒ xué yī, wǒmen de kè hěn duō.", "Very busy. I major in medicine, and we have a lot of classes."]],v:[["在", "zài", "adv.", "used to indicate an action in progress"], ["读", "dú", "v.", "attend school; study"], ["大学", "dàxué", "n.", "university; college"], ["大学生", "dàxuéshēng", "n.", "college/university student"], ["学", "xué", "v.", "study; learn"], ["医", "yī", "n.", "medicine"]]},
{h:"课文 3 · Text 3",d:[["lm", "弟弟起床没起床呢？", "Dìdi qǐchuáng méi qǐchuáng ne?", "Has your younger brother gotten up yet?"], ["lx", "没起床呢，还在睡觉。", "Méi qǐchuáng ne, hái zài shuìjiào.", "No, he hasn't gotten up yet. He's still sleeping."], ["lm", "还睡呢？他今天去不去那里？", "Hái shuì ne? Tā jīntiān qù bu qù nàli?", "Still sleeping? Is he going there today?"], ["lx", "去哪里？", "Qù nǎlǐ?", "Where?"], ["lm", "去超市。", "Qù chāoshì.", "To the supermarket."], ["lx", "我昨天问他，他对我说，他不去，他今天要和小朋友玩。", "Wǒ zuótiān wèn tā, tā duì wǒ shuō, tā bú qù, tā jīntiān yào hé xiǎopéngyou wán.", "I asked him yesterday. He told me he wasn't going. He's going to play with his friends today."]],v:[["弟弟", "dìdi", "n.", "younger brother"], ["起床", "qǐchuáng", "v.", "get up; get out of bed"], ["睡觉", "shuìjiào", "v.", "sleep"], ["睡", "shuì", "v.", "sleep"], ["那里", "nàlǐ", "pron.", "there; that place"], ["哪里", "nǎlǐ", "pron.", "where"], ["昨天", "zuótiān", "n.", "yesterday"], ["问", "wèn", "v.", "ask"], ["对", "duì", "prep.", "to; towards"], ["说", "shuō", "v.", "speak; talk; say"], ["要", "yào", "mod.", "want; wish"], ["小朋友", "xiǎopéngyou", "n.", "child; kid"]]}]}
,{n:12,zh:"昨天下雪了",en:"It snowed yesterday",t:[{h:"课文 1 · Text 1",d:[["yx", "今天天气怎么样？", "Jīntiān tiānqì zěnmeyàng?", "How's the weather today?"], ["wang", "这里的天不太好，下雨了。", "Zhèlǐ de tiān bú tài hǎo, xià yǔ le.", "It's not great here. It's raining."], ["yx", "雨大吗？", "Yǔ dà ma?", "Is it raining heavily?"], ["wang", "有点儿大，我觉得很冷。", "Yǒudiǎnr dà, wǒ juéde hěn lěng.", "A bit, and I feel really cold."]],v:[["天气", "tiānqì", "n.", "weather"], ["这里", "zhèlǐ", "pron.", "here"], ["天", "tiān", "n.", "weather; day"], ["下雨", "xià yǔ", "", "rain"], ["了", "le", "part.", "used at the end of a sentence to indicate a change of situation or state"], ["雨", "yǔ", "n.", "rain"], ["有点儿", "yǒudiǎnr", "adv.", "rather; a bit"], ["觉得", "juéde", "v.", "feel"], ["冷", "lěng", "adj.", "cold"]]},
{h:"课文 2 · Text 2",d:[["yx", "昨天下雪了。", "Zuótiān xià xuě le.", "It snowed yesterday."], ["yt", "是的，太冷了。", "Shì de, tài lěng le.", "Yes, it was so cold."], ["yx", "你昨天没来公司，生病了？", "Nǐ zuótiān méi lái gōngsī, shēngbìng le?", "You didn't come to the company yesterday. Were you feeling unwell?"], ["yt", "对，我昨天去医院看病了。", "Duì, wǒ zuótiān qù yīyuàn kànbìng le.", "Yes, I went to the hospital to see a doctor."]],v:[["下", "xià", "v.", "(of rain, snow, etc.) come down; fall"], ["雪", "xuě", "n.", "snow"], ["来", "lái", "v.", "come"], ["公司", "gōngsī", "n.", "company"], ["生病", "shēngbìng", "v.", "fall ill"], ["看病", "kànbìng", "v.", "(of a patient) see a doctor"]]},
{h:"课文 3 · Text 3",d:[["yt", "医生，我病了。", "Yīshēng, wǒ bìng le.", "Doctor, I'm not feeling well."], ["hu", "我看看。你觉得怎么样？", "Wǒ kànkan. Nǐ juéde zěnmeyàng?", "Let me take a look. How are you feeling?"], ["yt", "我很冷。", "Wǒ hěn lěng.", "I feel very cold."], ["hu", "好的，吃一点儿药，今天休息半天吧。", "Hǎo de, chī yìdiǎnr yào, jīntiān xiūxi bàn tiān ba.", "Alright. Take some medicine and rest for half a day today."], ["yt", "好的。", "Hǎo de.", "OK."], ["hu", "回家后再喝些热水。", "Huí jiā hòu zài hē xiē rè shuǐ.", "Make sure to drink some warm water after you get home."]],v:[["病", "bìng", "v.", "fall ill; be sick"], ["一点儿", "yìdiǎnr", "num.-m.", "some"], ["药", "yào", "n.", "medicine"], ["回", "huí", "v.", "return; go back"], ["再", "zài", "adv.", "then; only then"], ["喝", "hē", "v.", "drink"], ["热", "rè", "adj.", "hot; warm"], ["水", "shuǐ", "n.", "water"]]}]}
,{n:13,zh:"请给我一杯茶",en:"I'll have a cup of tea, please",t:[{h:"课文 1 · Text 1",d:[["bai", "王老师，我可以再问您一个问题吗？", "Wáng lǎoshī, wǒ kěyǐ zài wèn nín yí gè wèntí ma?", "Ms. Wang, may I ask you one more question?"], ["wang", "可以。你有什么问题？", "Kěyǐ. Nǐ yǒu shénme wèntí?", "Yes, of course. What's your question?"], ["bai", "那个小店卖不卖手机？", "Nàge xiǎo diàn mài bu mài shǒujī?", "Does that small shop sell cell phones?"], ["wang", "我不知道。你可以打电话问一下。", "Wǒ bù zhīdào. Nǐ kěyǐ dǎ diànhuà wèn yíxià.", "I'm not sure. You can call to ask."]],v:[["可以", "kěyǐ", "mod.", "can; may"], ["再", "zài", "adv.", "once more; again"], ["问题", "wèntí", "n.", "question; problem"], ["卖", "mài", "v.", "sell"], ["打电话", "dǎ diànhuà", "", "make a phone call; call"], ["一下", "yíxià", "num.-m.", "(used after a verb as its complement) one time; once"]]},
{h:"课文 2 · Text 2",d:[["fw", "女士，请坐！您喝什么？", "Nǚshì, qǐng zuò! Nín hē shénme?", "Madam, have a seat, please! What would you like to drink?"], ["yx", "我看一下。请给我一杯牛奶。", "Wǒ kàn yíxià. Qǐng gěi wǒ yì bēi niúnǎi.", "Let me have a look. I'll have a glass of milk, please."], ["fw", "好的。您还要什么？", "Hǎo de. Nín hái yào shénme?", "Alright. Would you like anything else?"], ["yx", "我还没吃早饭，再要这个面包和鸡蛋吧。", "Wǒ hái méi chī zǎofàn, zài yào zhège miànbāo hé jīdàn ba.", "I haven't had breakfast yet, so I'll have a fried egg on bread."]],v:[["服务员", "fúwùyuán", "n.", "attendant; waiter; waitress"], ["女士", "nǚshì", "n.", "lady; madam"], ["请", "qǐng", "v.", "please"], ["坐", "zuò", "v.", "sit"], ["给", "gěi", "v.", "give"], ["杯", "bēi", "n.", "cup; glass"], ["要", "yào", "v.", "demand; ask for"], ["早饭", "zǎofàn", "n.", "breakfast"], ["这个", "zhège", "pron.", "this"], ["面包", "miànbāo", "n.", "bread"], ["鸡蛋", "jīdàn", "n.", "(hen's) egg"]]},
{h:"课文 3 · Text 3",d:[["fw", "先生，请坐！您要什么？", "Xiānsheng, qǐng zuò! Nín yào shénme?", "Sir, have a seat, please! What would you like to order?"], ["lm", "我要一斤饺子。", "Wǒ yào yì jīn jiǎozi.", "I'd like one jin of jiaozi."], ["fw", "好的。一斤饺子四十个。", "Hǎo de. Yì jīn jiǎozi sìshí gè.", "Alright. One jin of jiaozi has forty pieces."], ["lm", "四十个太多了，我要一半吧。", "Sìshí gè tài duō le, wǒ yào yíbàn ba.", "Forty is too many. I'll have half of that."], ["fw", "半斤二十个。您想喝什么？", "Bàn jīn èrshí gè. Nín xiǎng hē shénme?", "Half is twenty. What would you like to drink?"], ["lm", "请给我一杯茶吧。", "Qǐng gěi wǒ yì bēi chá ba.", "I'll have a cup of tea, please."]],v:[["先生", "xiānsheng", "n.", "gentleman; sir"], ["一半", "yíbàn", "num.", "one half; half"], ["茶", "chá", "n.", "tea"]]}]}
,{n:14,zh:"我看了一个电影",en:"I watched a movie",t:[{h:"课文 1 · Text 1",d:[["bai", "你们上火车后看见王老师了吗？", "Nǐmen shàng huǒchē hòu kànjiàn Wáng lǎoshī le ma?", "Did you see Ms. Wang after boarding the train?"], ["chen", "没看见。中午车开后，有些人在看书，有些人睡觉了。", "Méi kànjiàn. Zhōngwǔ chē kāi hòu, yǒuxiē rén zài kàn shū, yǒuxiē rén shuìjiào le.", "No, we didn't. After the train departed at noon, some people were reading, while others fell asleep."], ["bai", "你呢？", "Nǐ ne?", "What about you?"], ["chen", "我看了一个电影。", "Wǒ kànle yí gè diànyǐng.", "I watched a movie."]],v:[["上", "shàng", "v.", "go up; get on; board"], ["火车", "huǒchē", "n.", "train"], ["中午", "zhōngwǔ", "n.", "noon"], ["开", "kāi", "v.", "(of vehicles) depart; leave"], ["有些", "yǒuxiē", "pron.", "(indicating a part) some"], ["有的", "yǒude", "pron.", "some"], ["了", "le", "part.", "used after a verb to indicate the completion of an action"]]},
{h:"课文 2 · Text 2",d:[["wang", "你们会说汉语了，也会写汉字了吗？", "Nǐmen huì shuō Hànyǔ le, yě huì xiě Hànzì le ma?", "You can speak Chinese now. Can you also write Chinese characters?"], ["bai", "我们都会写了。", "Wǒmen dōu huì xiě le.", "We can all write them now."], ["chen", "老师，我听不见。", "Lǎoshī, wǒ tīng bú jiàn.", "Teacher, I can't hear you."], ["wang", "请大家不要说话！请听老师的问题：你们都会写哪些汉字了？", "Qǐng dàjiā búyào shuōhuà! Qǐng tīng lǎoshī de wèntí: Nǐmen dōu huì xiě nǎxiē Hànzì le?", "Everyone, please stop talking! Listen to my question: Which Chinese characters can you write?"], ["chen", "我会写这些字了，您看！", "Wǒ huì xiě zhèxiē zì le, nín kàn!", "I can write these characters. Look!"]],v:[["写", "xiě", "v.", "write"], ["都", "dōu", "adv.", "all; both"], ["听见", "tīngjiàn", "v.", "hear"], ["不要", "búyào", "adv.", "don't"], ["说话", "shuōhuà", "v.", "say; speak; talk"], ["听", "tīng", "v.", "listen to; hear"], ["哪些", "nǎxiē", "pron.", "which"], ["字", "zì", "n.", "character; word"], ["汉语", "Hànyǔ", "", "Chinese language"], ["汉字", "Hànzì", "", "Chinese character"]]},
{h:"课文 3 · Text 3",d:[["lm", "明年女儿上中学。", "Míngnián nǚ'ér shàng zhōngxué.", "Our daughter will start middle school next year."], ["yx", "对。儿子也上小学了。", "Duì. Érzi yě shàng xiǎoxué le.", "That's right. Our son will also start primary school."], ["lm", "我们家有了一个中学生。", "Wǒmen jiā yǒule yí gè zhōngxuéshēng.", "We will have a middle school student in our family."], ["yx", "还有了一个小学生。", "Hái yǒule yí gè xiǎoxuéshēng.", "And a primary school student."], ["lm", "上学后，他们都忙了。", "Shàngxué hòu, tāmen dōu máng le.", "Once they start school, they will both be busy."], ["yx", "是的。太晚了，睡觉吧。", "Shì de. Tài wǎn le, shuìjiào ba.", "Yes. It's too late. Let's go to bed."]],v:[["明年", "míngnián", "n.", "next year"], ["上", "shàng", "v.", "begin to do sth at a fixed time"], ["中学", "zhōngxué", "n.", "middle school"], ["小学", "xiǎoxué", "n.", "primary school"], ["中学生", "zhōngxuéshēng", "n.", "middle school student"], ["小学生", "xiǎoxuéshēng", "n.", "primary school student; pupil"], ["上学", "shàngxué", "v.", "start school; go to school"], ["他们", "tāmen", "pron.", "they; them"], ["她们", "tāmen", "pron.", "(referring to female people) they; them"], ["它们", "tāmen", "pron.", "(plural of 它) they; them; their"], ["晚", "wǎn", "adj.", "late"]]}]}
,{n:15,zh:"大兴机场见！",en:"See you at Daxing Airport!",t:[{h:"课文 1 · Text 1",d:[["bai", "王老师，下个星期六我回法国。", "Wáng lǎoshī, xià gè xīngqīliù wǒ huí Fǎguó.", "Ms. Wang, I'm going back to France next Saturday."], ["wang", "你坐飞机回去吗？", "Nǐ zuò fēijī huíqù ma?", "Are you flying back?"], ["bai", "对，坐飞机。", "Duì, zuò fēijī.", "Yes, by plane."], ["wang", "飞机几点走？", "Fēijī jǐ diǎn zǒu?", "What time does the plane leave?"], ["bai", "下午三点。", "Xiàwǔ sān diǎn.", "At three in the afternoon."], ["wang", "好。你下午一点到机场吧。", "Hǎo. Nǐ xiàwǔ yī diǎn dào jīchǎng ba.", "OK. Get to the airport at one in the afternoon."]],v:[["下个", "xià gè", "", "next (one)"], ["星期六", "xīngqīliù", "n.", "Saturday"], ["回", "huí", "v.", "return; go back"], ["回去", "huíqù", "v.", "go back"], ["飞机", "fēijī", "n.", "airplane"], ["走", "zǒu", "v.", "leave; go"], ["机场", "jīchǎng", "n.", "airport"]]},

{h:"课文 2 · Text 2",d:[["li", "家月，这是大兴机场。这儿真大！", "Jiāyuè, zhè shì Dàxīng Jīchǎng. Zhèr zhēn dà!", "Jiayue, this is Daxing Airport. It's really big here!"], ["bai", "是啊。现在几点？", "Shì a. Xiànzài jǐ diǎn?", "Yes, it is. What time is it now?"], ["li", "现在十二点半。还早呢，你不要忙。", "Xiànzài shí'èr diǎn bàn. Hái zǎo ne, nǐ búyào máng.", "It's half past twelve. It's still early, so don't rush."], ["li", "你的飞机票呢？", "Nǐ de fēijī piào ne?", "Where's your plane ticket?"], ["bai", "在手机里，你看！", "Zài shǒujī lǐ, nǐ kàn!", "It's in my phone. Look!"], ["li", "好。我们去喝杯茶吧。", "Hǎo. Wǒmen qù hē bēi chá ba.", "OK. Let's go and have a cup of tea."], ["bai", "好的。你到法国后，给我打电话。", "Hǎo de. Nǐ dào Fǎguó hòu, gěi wǒ dǎ diànhuà.", "OK. Call me after you get to France."], ["li", "好的。我也想你们。", "Hǎo de. Wǒ yě xiǎng nǐmen.", "OK. I'll miss you all too."]],v:[["大兴机场", "Dàxīng Jīchǎng", "", "Daxing Airport"], ["飞机票", "fēijī piào", "n.", "plane ticket"], ["票", "piào", "n.", "ticket"], ["早", "zǎo", "adj.", "early"], ["啊", "a", "part.", "particle of agreement or surprise"], ["给", "gěi", "prep.", "to; for"], ["打电话", "dǎ diànhuà", "", "make a phone call"]]},

{h:"课文 3 · Text 3",d:[["wang", "同学们，你们都到了吗？", "Tóngxuémen, nǐmen dōu dào le ma?", "Class, have you all arrived?"], ["st", "到了！", "Dào le!", "We're here!"], ["wang", "这一年，你们学了不少汉语，也会写汉字了。", "Zhè yì nián, nǐmen xuéle bù shǎo Hànyǔ, yě huì xiě Hànzì le.", "This year you've learned quite a lot of Chinese, and you can write characters too."], ["bai", "谢谢您，王老师！", "Xièxie nín, Wáng lǎoshī!", "Thank you, Ms. Wang!"], ["chen", "老师，我们很想您！", "Lǎoshī, wǒmen hěn xiǎng nín!", "Teacher, we'll miss you a lot!"], ["wang", "我也想你们。明年你们再来中国吧！", "Wǒ yě xiǎng nǐmen. Míngnián nǐmen zài lái Zhōngguó ba!", "I'll miss you too. Come to China again next year!"], ["st", "好！大兴机场见！", "Hǎo! Dàxīng Jīchǎng jiàn!", "OK! See you at Daxing Airport!"], ["wang", "同学们，再见！", "Tóngxuémen, zàijiàn!", "Goodbye, class!"], ["st", "老师，再见！", "Lǎoshī, zàijiàn!", "Goodbye, teacher!"]],v:[["年", "nián", "n.", "year"], ["来", "lái", "v.", "come"], ["学", "xué", "v.", "study; learn"], ["见", "jiàn", "v.", "meet; see"]]}]}

 if(!synth){noteEl.textContent="This browser has no speech support, so Chinese and English audio are unavailable.";return}
 voice=zhVoice();
 noteEl.textContent=voice?"Chinese voice: "+voice.name+" ("+voice.lang+").":"No Chinese voice found. Install a Chinese (Mandarin) text-to-speech voice in your phone settings."}
pv();if(synth)synth.onvoiceschanged=pv;

/* Speak through the device voices. Resolves true when it spoke (or was stopped), false when it failed silently. */
function utter(text,lang,pick,pitch,btn,watchdog){
 return new Promise(res=>{
  if(nativeTTS){
   const my=tok,id=String(++nativeSeq);let settled=false;
   const finish=ok=>{if(settled)return;settled=true;nativePending.delete(id);btn&&btn.classList.remove("on");res(ok)};
   nativePending.set(id,finish);btn&&btn.classList.add("on");
   try{window.AndroidTTS.speak(String(text),lang.startsWith("zh")?"zh":"en",rate,id)}catch(e){finish(false)}
   return;
  }
  if(!synth)return res(false);
  const my=tok,u=new SpeechSynthesisUtterance(text);
  u.lang=lang;const v=pick&&pick();if(v){u.voice=v;u.lang=v.lang}
  u.rate=rate;if(pitch)u.pitch=pitch;
  keep.add(u);btn&&btn.classList.add("on");
  let started=false,done=false,timer=0;
  const fin=ok=>{if(done)return;done=true;clearTimeout(timer);keep.delete(u);btn&&btn.classList.remove("on");res(ok)};
  u.onstart=()=>{started=true;clearTimeout(timer)};
  u.onend=()=>fin(true);
  u.onerror=e=>fin(started||my!==tok||e.error==="interrupted"||e.error==="canceled");
  /* Chrome drops a speak() that comes in the same tick as cancel(), so wait a moment first */
  setTimeout(()=>{
   if(my!==tok)return fin(true);
   if(synth.paused)synth.resume();
   synth.speak(u);
   if(watchdog)timer=setTimeout(()=>{if(!started){synth.cancel();fin(false)}},watchdog)
  },60)})}
const say=(x,p,b)=>utter(x,"zh-CN",()=>voice,p||1,b);
const sayEn=(x,b)=>utter(x,"en-US",enVoice,0,b);


function stopAll(){
 tok++;if(go){go();go=null}
 if(synth)synth.cancel();
 if(nativeTTS){try{window.AndroidTTS.stop()}catch(e){};for(const [id,finish] of nativePending)finish(true)}
 document.querySelectorAll(".spk.on,.pill.on,.ntile.on,.ntile.playing").forEach(b=>b.classList.remove("on"));
 document.querySelectorAll(".line.playing,.ntile.playing").forEach(r=>r.classList.remove("playing"))}

/* ---------- builders ---------- */
const tb=t=>{const b=$("button","pill enb",ICON+"<span>EN</span>");b.title="Play English";b.setAttribute("aria-label","Play English");b.onclick=()=>{stopAll();sayEn(t,b)};return b};
const sb=f=>{const b=$("button","spk play",ICON);b.setAttribute("aria-label","Play Chinese");b.onclick=()=>{stopAll();f(b)};return b};

function dlg(el,d){
 const bar=$("div","bar"),all=$("button","btn",'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2v9.6L10.5 6z" fill="currentColor"/></svg>Play all'),sel=$("select"),rp=$("button","btn alt","Role-play"),nx=$("button","btn nx hide","Next");
 sel.setAttribute("aria-label","Choose your role");
 sel.innerHTML="<option value=''>I play…</option>";[...new Set(d.map(x=>x[0]))].forEach(s=>sel.innerHTML+=`<option value="${s}">${SP[s][0]} ${SP[s][1]}</option>`);
 bar.append(all,sel,rp,nx);el.append(bar);
 const rows=d.map(([s,zh,py,en])=>{
  const r=$("div","line"),w=$("div","who",`<b>${SP[s][0]}</b>${SP[s][1]}`),
  t=$("div","txt",`<div class="py">${py}</div><div class="zh">${zh}</div>${pr(zh)}<div class="en">${en}</div>${tru(zh)}`);
  t.querySelector(".en").append(tb(en));r.append(w,t,sb(b=>say(zh,SP[s][2],b)));el.append(r);return r});
 async function run(me){
  stopAll();const my=tok;
  for(let i=0;i<d.length;i++){
   if(my!==tok)return;
   const r=rows[i];r.classList.add("playing");r.scrollIntoView({block:"nearest"});
   if(me&&d[i][0]===me){nx.classList.remove("hide");await new Promise(f=>go=f);nx.classList.add("hide")}
   else{
    await say(d[i][1],SP[d[i][0]][2],r.querySelector(".spk.play"));
    if(trOn&&my===tok){await sleep(200);await sayEn(d[i][3],null)}
}
   r.classList.remove("playing");await sleep(300)}}
 all.onclick=()=>run(null);
 nx.onclick=()=>{if(go){const f=go;go=null;f()}};
 rp.onclick=()=>sel.value?run(sel.value):toast("Choose your role first.");
}
function vocab(el,v){
 const t=$("table");
 v.forEach(([zh,py,pos,en])=>{
  const tr=$("tr",0,`<td class="zh">${zh}</td><td><div class="py">${py}</div>${pr(zh)}<div class="en">${pos?`<i class="pos">${pos}</i> `:""}${en}</div>${tru(zh)}</td><td></td>`);
  tr.lastChild.append(sb(b=>say(zh,1,b)));tr.children[1].querySelector(".en").append(tb(en));t.append(tr)});
 el.append(t)}
function show(n,scrollTop){
 stopAll();const l=L.find(x=>x.n===n),el=lessonEl;el.innerHTML="";
 document.querySelectorAll(".chip").forEach(c=>{const on=+c.dataset.n===n;c.classList.toggle("on",on);if(on){c.setAttribute("aria-current","true");c.scrollIntoView({inline:"center",block:"nearest"})}else c.removeAttribute("aria-current")});
 el.append($("h2","lt",`<span class="no">Lesson ${n}</span>${l.zh}<span class="en">${l.en}</span>`));
 l.t.forEach(x=>{
  el.append($("h2","sec",x.h));const c=$("div","card");dlg(c,x.d);el.append(c);
  el.append($("h3","vh","生词 New Words"));const v=$("div","card vc");vocab(v,x.v);el.append(v)});
 if(l.tw){
  el.append($("h2","sec","跟读绕口令 · Tongue Twister"));
  const c=$("div","card"),r=$("div","line solo"),t=$("div","txt",`<div class="py">${l.tw[1]}</div><div class="zh">${l.tw[0]}</div>${pr(l.tw[0])}<div class="en">${l.tw[2]}</div>${tru(l.tw[0])}`);
  t.querySelector(".en").append(tb(l.tw[2]));r.append(t,sb(b=>say(l.tw[0],1,b)));c.append(r);el.append(c)}

/* ---------- counting ---------- */
const PLAY='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.2v9.6L10.5 6z" fill="currentColor"/></svg>';
const DG=["零","一","二","三","四","五","六","七","八","九"];
/* per character: [pinyin, English respelling, Urdu respelling] */
const CH={"零":["líng","ling","لنگ"],"一":["yī","ee","ای"],"二":["èr","are","آر"],"两":["liǎng","lyahng","لیانگ"],"三":["sān","sahn","سان"],"四":["sì","suh","سی"],"五":["wǔ","woo","وو"],"六":["liù","lyo","لیو"],"七":["qī","chee","چی"],"八":["bā","bah","با"],"九":["jiǔ","jyo","جیو"],"十":["shí","shr","شی"],"百":["bǎi","bye","بائی"],"千":["qiān","chyen","چیان"],"万":["wàn","wahn","وان"],"亿":["yì","ee","ای"]};
const YI_BEFORE={"百":"yì","千":"yì","万":"yí","亿":"yí"}; /* 一 changes tone before a multiplier; as a digit before 十 it stays yī */
function grp(v,lead){ /* 1–9999 as characters */
 const dg=[Math.floor(v/1000),Math.floor(v/100)%10,Math.floor(v/10)%10,v%10],un=["千","百","十",""],o=[];let st=false,pend=false;
 for(let i=0;i<4;i++){const d=dg[i];
  if(d===0){if(st)pend=true;continue}
  if(pend){o.push("零");pend=false}
  if(i===2&&d===1&&!st&&lead)o.push("十"); /* 10–19 start with 十, not 一十 */
  else{o.push(d===2&&i<2?"两":DG[d]);if(un[i])o.push(un[i])}
  st=true}
 return o}
function zhNum(n){
 if(n===0)return["零"];
 const parts=[Math.floor(n/1e8),Math.floor(n/1e4)%1e4,n%1e4],suf=["亿","万",""],o=[];let st=false,pend=false;
 for(let i=0;i<3;i++){const v=parts[i];
  if(v===0){if(st)pend=true;continue}
  if(st&&(pend||v<1000))o.push("零");
  pend=false;
  if(v===2&&suf[i])o.push("两");else o.push(...grp(v,!st));
  if(suf[i])o.push(suf[i]);
  st=true}
 return o}
function readNum(n){
 const c=zhNum(n),pyA=c.map((ch,i)=>ch==="一"&&YI_BEFORE[c[i+1]]?YI_BEFORE[c[i+1]]:CH[ch][0]);
 return{c,zh:c.join(""),pyA,py:pyA.join(" "),er:c.map(ch=>CH[ch][1]).join(" "),ur:c.map(ch=>CH[ch][2]).join(" ")}}
const EN_N=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const UR_N=["صفر","ایک","دو","تین","چار","پانچ","چھ","سات","آٹھ","نو","دس","گیارہ","بارہ","تیرہ","چودہ","پندرہ","سولہ","سترہ","اٹھارہ","انیس","بیس"];
const TENS={30:["thirty","تیس"],40:["forty","چالیس"],50:["fifty","پچاس"],60:["sixty","ساٹھ"],70:["seventy","ستر"],80:["eighty","اسی"],90:["ninety","نوے"],100:["one hundred","سو"]};
const nameOf=n=>n<=20?[EN_N[n],UR_N[n]]:TENS[n];
const item=(n,en,un)=>Object.assign({n,en,un},readNum(n));
const itemN=n=>{const m=nameOf(n);return item(n,m[0],m[1])};
const UDIG="۰۱۲۳۴۵۶۷۸۹",udig=n=>String(n).replace(/\d/g,d=>UDIG[d]),fmt=n=>n.toLocaleString("en-US");
const range=(a,b,s=1)=>{const o=[];for(let i=a;i<=b;i+=s)o.push(i);return o};
const tip=h=>$("div","tip",h);

async function countRun(items,tiles){
 stopAll();const my=tok;
 for(let i=0;i<items.length;i++){
  if(my!==tok)return;
  const t=tiles[i];t.classList.add("playing");t.scrollIntoView({block:"nearest"});
  await say(items[i].zh,1,null);
  if(trOn&&my===tok){await sleep(150);await sayEn(items[i].en,null)}

  t.classList.remove("playing");await sleep(250)}}
function tile(it){
 const b=$("button","ntile",`<span class="dg">${it.n}</span><span class="ud" aria-hidden="true">${udig(it.n)}</span><span class="h">${it.zh}</span><span class="p">${it.py}</span><span class="pr">${it.er}</span><span class="ur prx" lang="ur" dir="rtl">${it.ur}</span><span class="w">${it.en} · <span lang="ur">${it.un}</span></span>`);
 b.setAttribute("aria-label",it.n+", "+it.en+", "+it.zh);
 b.onclick=()=>{stopAll();say(it.zh,1,b)};return b}
function tileSet(el,items,label){
 const bar=$("div","bar"),btn=$("button","btn",PLAY+label),grid=$("div","ngrid");
 const ts=items.map(it=>{const t=tile(it);grid.append(t);return t});
 btn.onclick=()=>countRun(items,ts);bar.append(btn);el.append(bar,grid)}
function bigRow(it){
 const r=$("div","line solo"),t=$("div","txt",`<div class="py">${it.py}</div><div class="zh">${it.zh}</div><div class="sound"><div class="pr">${it.er}</div><div class="ur prx" lang="ur" dir="rtl">${it.ur}</div></div><div class="en"><span class="big">${fmt(it.n)}</span> ${it.en}</div><div class="ur ut" lang="ur" dir="rtl">${it.un}</div>`);
 t.querySelector(".en").append(tb(it.en));r.append(t,sb(b=>say(it.zh,1,b)));return r}

function builder(el){
 const card=$("div","card"),bar=$("div","bar"),inp=$("input","nin"),rnd=$("button","btn alt","Random number");
 inp.type="text";inp.inputMode="numeric";inp.maxLength=9;inp.value="35";inp.setAttribute("aria-label","Type a number from 0 to 999,999,999");
 const big=$("div","nbig"),row=$("div","nrow"),toks=$("div","toks"),snd=$("div","sound nsound");let cur=null;
 const play=sb(b=>{if(cur)say(cur.zh,1,b)});
 row.append(toks,play);bar.append(inp,rnd);card.append(bar,big,row,snd);el.append(card);
 function draw(){
  const raw=inp.value.replace(/\D/g,"").slice(0,9);if(inp.value!==raw)inp.value=raw;
  if(raw===""){cur=null;big.textContent="Type a number to see how it is said in Chinese.";toks.innerHTML="";snd.classList.add("hide");return}
  const n=parseInt(raw,10);cur=readNum(n);snd.classList.remove("hide");
  big.innerHTML=`<b>${fmt(n)}</b><span lang="ur">${udig(n)}</span>`;
  toks.innerHTML=cur.c.map((ch,i)=>`<span class="tok"><b>${ch}</b><i>${cur.pyA[i]}</i></span>`).join("");
  snd.innerHTML=`<div class="py">${cur.py}</div><div class="pr">${cur.er}</div><div class="ur prx" lang="ur" dir="rtl">${cur.ur}</div>`}
 inp.oninput=draw;
 rnd.onclick=()=>{const n=Math.floor(Math.random()*Math.pow(10,1+Math.floor(Math.random()*5)));inp.value=n;draw();stopAll();say(cur.zh,1,play)};
 draw()}

function quiz(el){
 const R={"1–10":[1,10],"1–20":[1,20],"1–100":[1,100],"1–1,000":[1,1000]};
 const card=$("div","card"),bar=$("div","bar"),sel=$("select"),top=$("div","qtop"),opts=$("div","qopts"),fb=$("div","qfb"),next=$("button","btn alt","Next number"),score=$("span","score","Score 0 / 0");
 sel.setAttribute("aria-label","Number range");Object.keys(R).forEach(k=>sel.innerHTML+=`<option>${k}</option>`);
 let ans=0,right=0,total=0,locked=false;
 const play=sb(b=>say(zhNum(ans).join(""),1,b));
 bar.append(sel);top.append(play,$("p",0,"Listen, then tap the number you heard."),score);
 fb.setAttribute("role","status");card.append(bar,top,opts,fb,next);el.append(card);
 function choices(lo,hi){
  const s=new Set([ans]);
  [1,-1,2,-2,3,-3,10,-10,100,-100].sort(()=>Math.random()-.5).forEach(d=>{const v=ans+d;if(s.size<4&&v>=lo&&v<=hi)s.add(v)});
  while(s.size<4)s.add(lo+Math.floor(Math.random()*(hi-lo+1)));
  return[...s].sort(()=>Math.random()-.5)}
 function ask(listen){
  const[lo,hi]=R[sel.value];ans=lo+Math.floor(Math.random()*(hi-lo+1));locked=false;fb.textContent="";opts.innerHTML="";
  choices(lo,hi).forEach(n=>{const b=$("button","qopt",fmt(n));b.onclick=()=>pick(n,b);b.dataset.n=n;opts.append(b)});
  if(listen){stopAll();say(zhNum(ans).join(""),1,play)}}
 function pick(n,b){
  if(locked)return;locked=true;total++;
  const r=readNum(ans);
  if(n===ans){right++;b.classList.add("ok");fb.innerHTML=`Correct. <span class="zh">${r.zh}</span> · ${r.py}`}
  else{b.classList.add("bad");opts.querySelector(`[data-n="${ans}"]`).classList.add("ok");fb.innerHTML=`Not quite. It was <b>${fmt(ans)}</b>: <span class="zh">${r.zh}</span> · ${r.py}`}
  score.textContent=`Score ${right} / ${total}`}
 sel.onchange=()=>{right=0;total=0;score.textContent="Score 0 / 0";ask(true)};
 next.onclick=()=>ask(true);ask(false)}

function showCounting(scrollTop){
 stopAll();
 document.querySelectorAll(".chip").forEach(c=>{const on=c===cntBtn;c.classList.toggle("on",on);if(on)c.setAttribute("aria-current","true");else c.removeAttribute("aria-current")});
 const el=lessonEl;el.innerHTML="";
 el.append($("h2","lt",`<span class="no">Learn to count</span>数数<span class="en">Counting in Chinese, from 0 to 100 million</span>`));
 el.append(tip("Tap any number to hear it. <b>Count along</b> plays a whole row, one number after another. Turn on <b>English</b> at the top to hear the meaning after each number. Urdu meanings remain available as text."));

 el.append($("h2","sec","0–10 · 基本数字 Basic numbers"));
 let c=$("div","card");tileSet(c,range(0,10).map(itemN),"Count along 0–10");el.append(c);

 el.append($("h2","sec","11–20 · 十几 Teens"));
 c=$("div","card");tileSet(c,range(11,20).map(itemN),"Count along 11–20");
 c.append(tip(`Say <span class="zh">十</span> (ten), then the digit: <span class="zh">十</span> + <span class="zh">五</span> = <span class="zh">十五</span>, which is 15. Twenty is <span class="zh">二十</span>, meaning “two tens”.`));el.append(c);

 el.append($("h2","sec","10–100 · 整十 Tens"));
 c=$("div","card");tileSet(c,range(10,100,10).map(itemN),"Count along by tens");
 c.append(tip(`Digit + <span class="zh">十</span>: <span class="zh">三</span> + <span class="zh">十</span> = <span class="zh">三十</span> (30). Add one more digit for numbers in between: <span class="zh">三十五</span> is 35 and <span class="zh">九十九</span> is 99.`));el.append(c);

 el.append($("h2","sec","百 · 千 · 万 · 亿 Hundreds and beyond"));
 c=$("div","card");
 c.append(tip(`<b>零 líng</b> fills a gap: <span class="zh">一百零一</span> is 101. <b>两 liǎng</b> replaces 二 before 百, 千 and 万: <span class="zh">两百</span> is 200. In Urdu terms, <span class="zh">十万</span> is one <b>lakh</b> and <span class="zh">一千万</span> is one <b>crore</b>.`));
 [[100,"one hundred","سو"],[101,"one hundred and one","ایک سو ایک"],[110,"one hundred and ten","ایک سو دس"],[200,"two hundred","دو سو"],[1000,"one thousand","ایک ہزار"],[2000,"two thousand","دو ہزار"],[10000,"ten thousand","دس ہزار"],[100000,"one hundred thousand (one lakh)","ایک لاکھ"],[1000000,"one million (ten lakh)","دس لاکھ"],[10000000,"ten million (one crore)","ایک کروڑ"],[100000000,"one hundred million (ten crore)","دس کروڑ"]]
  .forEach(a=>c.append(bigRow(item(a[0],a[1],a[2]))));
 el.append(c);

 el.append($("h2","sec","数字生成器 Number builder"));
 el.append(tip("Type any number up to 999,999,999. Each piece is shown with its pinyin, so you can see how the number is built."));
 builder(el);

 el.append($("h2","sec","听力练习 Listening quiz"));
 quiz(el);
 if(scrollTop)window.scrollTo(0,0)}

/* ---------- wiring ---------- */
T.forEach((z,i)=>{const b=$("button","chip",i+1);b.dataset.n=i+1;b.title=z;b.setAttribute("aria-label","Lesson "+(i+1)+": "+z);b.disabled=!L.some(x=>x.n===i+1);b.onclick=()=>show(i+1,true);menuEl.append(b)});
const cntBtn=$("button","chip cnt",'<b aria-hidden="true">数</b><span>Counting</span>');cntBtn.title="Counting 数数";cntBtn.setAttribute("aria-label","Counting lessons");cntBtn.onclick=()=>showCounting(true);menuEl.prepend(cntBtn);
function flip(btn,on,label){btn.classList.toggle("is-on",on);btn.setAttribute("aria-pressed",on);btn.querySelector(".st").textContent=label}
trBtn.onclick=()=>{trOn=!trOn;flip(trBtn,trOn,trOn?"On":"Off")};
stopBtn.onclick=stopAll; /* the old code used the id "stop", which collided with window.stop, so this button never worked */
spdBtn.onclick=()=>{rate=rate===.85?.6:rate===.6?1:.85;spdBtn.textContent="Speed: "+(rate===.6?"Slow":rate===1?"Fast":"Normal")};
show(1);
